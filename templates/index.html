<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ansible Playbook Generator</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.5/lib/codemirror.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.5/theme/monokai.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.5/addon/lint/lint.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.5.1/styles/default.min.css">
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        .container { display: flex; flex-direction: column; gap: 20px; }
        .form-container { width: 100%; background-color: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); }
        .task-pane { margin-bottom: 15px; padding: 15px; border: 1px solid #ddd; border-radius: 8px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        .CodeMirror { border: 1px solid #ddd; border-radius: 4px; font-size: 14px; margin-bottom: 10px; max-height: 150px; overflow-y: auto; }
        .CodeMirror-lint-tooltip { font-size: 12px; }
        button { padding: 10px 15px; background-color: #007bff; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button#generate { margin-top: 10px; }
        .preview-container { background-color: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); }
        pre { background-color: #282a36; color: #f8f8f2; padding: 10px; border-radius: 5px; max-height: 200px; white-space: pre-wrap; word-wrap: break-word; overflow-y: auto; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.5/lib/codemirror.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.5/mode/yaml/yaml.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.5/addon/lint/lint.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.5/addon/lint/yaml-lint.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.5/addon/hint/show-hint.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.5/addon/hint/yaml-hint.js"></script>
</head>
<body>
    <h1>Ansible Playbook Generator</h1>
    <div class="container">
        <div class="form-container">
            <form id="playbookForm" action="/generate" method="POST">
                <div id="tasksContainer"></div>
                <button type="button" id="addTask">Add New Task</button>
                <button type="submit" id="generate">Generate Playbook</button>
            </form>
        </div>
        <div class="preview-container">
            <h2>Playbook Preview</h2>
            <pre><code id="preview" class="yaml"></code></pre>
            <a id="downloadLink" download="playbook.yml" href="#">Download Playbook</a>
        </div>
    </div>

    <script>
        let editors = [];

        document.addEventListener('DOMContentLoaded', () => {
            const addTask = () => {
                const container = document.getElementById('tasksContainer');
                const taskPane = document.createElement('div');
                taskPane.classList.add('task-pane');

                // Task Name
                const taskNameLabel = document.createElement('label');
                taskNameLabel.textContent = 'Task Name:';
                taskPane.appendChild(taskNameLabel);
                const taskNameInput = document.createElement('input');
                taskNameInput.type = 'text';
                taskNameInput.name = 'tasks';
                taskNameInput.required = true;
                taskNameInput.addEventListener('input', updatePreview);
                taskPane.appendChild(taskNameInput);

                // Task Details with CodeMirror editor
                const taskDetailsLabel = document.createElement('label');
                taskDetailsLabel.textContent = 'Task Details:';
                taskPane.appendChild(taskDetailsLabel);
                const taskDetailsTextarea = document.createElement('textarea');
                taskDetailsTextarea.name = 'actions';
                taskPane.appendChild(taskDetailsTextarea);

                // Initialize CodeMirror editor for Task Details with linting enabled
                const editor = CodeMirror.fromTextArea(taskDetailsTextarea, {
                    mode: "yaml",
                    lineNumbers: false,
                    theme: "monokai",
                    lineWrapping: true,
                    autoRefresh: true,
                    extraKeys: { "Ctrl-Space": "autocomplete" },
                    gutters: ["CodeMirror-lint-markers"],
                    lint: true
                });

                editor.on("change", updatePreview);
                editors.push(editor);

                container.appendChild(taskPane);
                updatePreview();
            };

            const updatePreview = () => {
                const tasks = document.querySelectorAll('.task-pane');
                let preview = '---\n';

                tasks.forEach((task, index) => {
                    const name = task.querySelector('input[name="tasks"]').value.trim();
                    const details = editors[index].getValue().trim();

                    if (name) preview += `- name: ${name}\n`;
                    if (details) preview += `  ${details.replace(/\n/g, '\n  ')}\n\n`;
                });

                document.getElementById('preview').textContent = preview;
                hljs.highlightAll();
            };

            document.getElementById('addTask').addEventListener('click', addTask);
            addTask();  // Add initial task pane on page load
        });
    </script>
</body>
</html>
